<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="panels">
      <ion-button fill="clear">
        <ion-label>{{username}}</ion-label>
      </ion-button>
      <div>
        <ion-button fill="clear">
          <ion-icon name="add"></ion-icon>
        </ion-button>
        <ion-button fill="clear">
          <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="mainHolder">

    <section class="story-panel">
      <div class="story-context">
        <div class="height-light" [class.active]="false">
          <div class="story-relative">
            <ion-avatar class="person">
              <ion-img [src]="getUserAvatar()" alt="User Avatar"></ion-img>
            </ion-avatar>
            <ion-button class="story-add-absolute" fill="clear" shape="round" size="small">
              <ion-icon class="add-btn" slot="icon-only" name="add"></ion-icon>
            </ion-button>
          </div>
        </div>
        <span>Your story</span>
      </div>
      
      <div class="story-context" *ngFor="let item of highlights">
        <div class="height-light" [class.active]="true">
          <ion-avatar class="person">
              <ion-img [src]="item.imgUrl" alt="User Avatar"></ion-img>
          </ion-avatar>
        </div>
        <span>{{item?.username}}</span>
      </div>
      
    </section>

    <div class="post-panel">
      <article class="card-board" *ngFor="let feed of feeds" >
        <div class="post-header">
          <div class="divided">
            <ion-avatar class="avatar-img">
              <ion-img [src]="feed.avatar" alt="User Avatar"></ion-img>  
            </ion-avatar>
            <div class="avatar-title">
              <a><span>{{feed?.username}}</span></a>
              <span>{{feed?.location}}</span>
            </div>
          </div>
          <ion-button shape="round" fill="clear" size="small">
            <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
          </ion-button>
        </div>

        <div class="post-content">
            <ion-img [src]="feed.postUrl"></ion-img>
        </div>

        <div class="post-bottom">
          <div class="toggle-icon">
            <div class="left-toggle">
              <ion-button shape="round" fill="clear" size="small">
                <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
                <span>{{feed?.likes}}</span>
              </ion-button>
              <ion-button shape="round" fill="clear" size="small">
                <ion-icon slot="icon-only" name="chatbox-outline"></ion-icon>
                <span>{{feed?.comments}}</span>
              </ion-button>
              <ion-button shape="round" fill="clear" size="small">
                <ion-icon slot="icon-only" name="paper-plane-outline"></ion-icon>
                <span>{{feed?.shares}}</span>
              </ion-button>
            </div>
            <ion-button shape="round" fill="clear" size="small">
              <ion-icon slot="icon-only" name="bookmark-outline"></ion-icon>
            </ion-button>
          </div>

          <div class="subtitle-panel">
            <p>{{feed?.likes}} likes</p>
            <p><span>{{feed?.username}}</span> {{feed?.paragraph}}</p>
            <a class="view-btn">View all {{feed?.comments}} comments</a>
            <p class="para">{{feed?.postTime}}</p>
          </div>
        </div>
      </article>
    </div>
  </div>
</ion-content>
