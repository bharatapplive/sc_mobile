<ion-content class="ion-padding">
  <div class="login-container">
    
    <!-- 1. Header (Logo & Text) -->
    <div class="header">
      <div class="logo-box">
        <ion-icon name="people"></ion-icon>
      </div>
      <h1>Social Circle</h1>
      <p>Connect with creators, share your story, and join the digital circle.</p>
    </div>

    <!-- 2. Input Fields (Naya Update Yahan Hai) -->
    <div class="form-section">
      <label>Username or Email</label>
      <ion-item class="custom-input" lines="none">
        <ion-icon name="at" slot="start" color="medium"></ion-icon>
        <!-- [(ngModel)] appko TS file wale variable se jodta hai -->
        <ion-input type="text" placeholder="username@social.com" [(ngModel)]="userEmail"></ion-input>
      </ion-item>

      <label>Password</label>
      <ion-item class="custom-input" lines="none">
        <ion-icon name="lock-closed" slot="start" color="medium"></ion-icon>
        <!-- Yahan password input jod diya -->
        <ion-input [type]="passwordType" placeholder="Password" [(ngModel)]="userPassword"></ion-input>
        <ion-icon [name]="passwordIcon" slot="end" color="medium" (click)="togglePassword()" style="cursor: pointer;"></ion-icon>
      </ion-item>

      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>

      <!-- 3. Gradient Login Button. Yahan click lagaya hai -->
      <ion-button expand="block" class="login-btn" (click)="onLogin()">
        Log In
      </ion-button>
    </div>

    <!-- 4. Divider -->
    <div class="divider">
      <hr>
      <span>OR CONTINUE WITH</span>
      <hr>
    </div>

    <!-- 5. Social Login Buttons -->
    <div class="social-buttons">
      <ion-button fill="outline" class="social-btn">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Google
      </ion-button>
      <ion-button fill="outline" class="social-btn">
        <ion-icon name="logo-apple" slot="start"></ion-icon>
        Apple
      </ion-button>
    </div>

    <!-- 6. Footer -->
    <div class="footer">
      <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

  </div>
</ion-content>
