<ion-content class="custom-bg">
  <div class="main-container">
    
    <!-- Header Section -->
    <div class="header-section">
      <div class="logo-box">
        <ion-icon name="people"></ion-icon>
      </div>
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join Social Circle and start sharing your story with the world.</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      
      <!-- 1. Full Name Input -->
      <div class="input-group">
        <ion-label class="input-label">Full Name</ion-label>
        <div class="input-box">
          <ion-icon name="person-outline" class="icon-left"></ion-icon>
          <ion-input type="text" placeholder="Name"></ion-input>
        </div>
      </div>

      <!-- 2. Username Input (Instagram Style) -->
      <div class="input-group">
        <ion-label class="input-label">Username</ion-label>
        <div class="input-box">
          <ion-icon name="at-outline" class="icon-left"></ion-icon>
          <ion-input type="text" placeholder="username"></ion-input>
        </div>
      </div>

      <!-- 3. Email Input -->
      <div class="input-group">
        <ion-label class="input-label">Email Address</ion-label>
        <div class="input-box">
          <ion-icon name="mail-outline" class="icon-left"></ion-icon>
          <ion-input type="email" placeholder="username@social.com"></ion-input>
        </div>
      </div>

      <!-- 4. Date of Birth Input (Instagram Style) -->
      <div class="input-group">
        <ion-label class="input-label">Date of Birth</ion-label>
        <div class="input-box">
          <ion-icon name="calendar-outline" class="icon-left"></ion-icon>
          <ion-input type="date"></ion-input>
        </div>
      </div>

      <!-- 5. Password Input -->
      <div class="input-group">
        <ion-label class="input-label">Password</ion-label>
        <div class="input-box">
          <ion-icon name="lock-closed-outline" class="icon-left"></ion-icon>
          <ion-input [type]="passwordType" placeholder="Create a password"></ion-input>
          <ion-icon [name]="passwordIcon" class="icon-right" style="cursor: pointer;" (click)="togglePasswordMode()"></ion-icon>
        </div>
      </div>

      <!-- Sign Up Button -->
      <ion-button expand="block" class="login-btn" (click)="signUp()" style="margin-top: 25px;">Sign Up</ion-button>
    </div>

    <!-- Footer Section -->
    <div class="footer-section">
      <p>Already have an account? <a style="cursor: pointer;" (click)="goToLogin()">Log In</a></p>
    </div>

  </div>
</ion-content>
