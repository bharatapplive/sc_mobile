<header class="head">
    <div class="flex">
      <span class="material-symbols-outlined circle">circle</span>
      <h2 style="font-weight: 800;">Social Circle</h2>
    </div>
</header>
<main class="box">
    <h1 style="font-weight: 800; font-size: 36px; text-align: center;">Join the Circle.</h1>
    <p style="text-align: center;">Where creators connect and the digital pulse comes alive.</p>
  <div class="card">

  <section class="glass-card rounded-xl p-md md:p-lg space-y-md relative overflow-hidden">
      <form class="form" action="#" method="post">
      
        <div class="field">
          <label for="name">Full Name</label>
          <div class="input">
            <span class="material-symbols-outlined">person</span>
            <input id="name" placeholder="Alex Rivera" type="text">
          </div>
        </div>
    
      <div class="field">
        <label for="email">Email</label>
        <div class="input">
          <span class="material-symbols-outlined">alternate_email</span>
          <input id="email" placeholder="alex@creators.io" type="email">
        </div>
      </div>
      
      <div class="field">
        <label for="mobile">Mobile Number</label>
        <div class="input">
          <span class="material-symbols-outlined">smartphone</span>
          <input id="mobile" placeholder="+1 (555) 000-0000" type="tel">
        </div>
      </div>
      
      <div class="field">
        <label for="password">Password</label>
        <div class="input">
          <span class="material-symbols-outlined">lock</span>
          <input id="password" placeholder="••••••••" type="password">
          <button type="button" aria-label="Show password">
          <span class="material-symbols-outlined">visibility</span>
          </button>
        </div>
      </div>
        <button class="btn vibrant-gradient" type="submit">
          <span class="">Sign Up</span>
        </button>
      </form>
      <div class="text-center">
          <p><b>By signing up, you agree to our <a class="links" href="#">Terms</a> &amp;  <a class="links" href="#">Privacy Policy</a>.</b></p>
      </div>
      <div class="divider">
        <span>OR CONTINUE WITH</span>
    </div>
    <div class="flex2">
      <button class="border">
        <div class="container">
            <svg class="w-full h-full" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.26.81-.58z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
            </svg>
        </div>
        <span style="font-weight: 700;">Google</span>
      </button>
      <button class="border">
        <div class="container">
          <svg class="w-full h-full fill-current" viewBox="0 0 24 24">
          <path d="M17.05 20.28c-.96.95-2.18 1.78-3.41 1.78-1.33 0-1.84-.79-3.41-.79-1.57 0-2.12.78-3.41.78-1.18 0-2.54-.95-3.51-1.92-2.14-2.14-2.73-5.78-1.07-8.15 1.06-1.52 2.76-2.5 4.54-2.5 1.3 0 2.22.75 3.33.75 1.09 0 2.16-.77 3.44-.77 1.54 0 2.82.78 3.65 1.86-3.1 1.65-2.61 5.92.51 7.16-.48 1.48-1.5 3.23-2.67 4.3zm-4.32-15.69c0-1.78 1.46-3.23 3.23-3.23.04 0 .09 0 .14.01 0 1.78-1.46 3.23-3.23 3.23-.05 0-.1 0-.14-.01z"></path>
          </svg>
        </div>
        <span style="font-weight: 700;">Apple</span>
      </button>
    </div> 
  </section>
</div>

    
    <div class="text-center">
     <p style="font-size: 16px;">Already have an account? <a class="links" href="#"><b>Log In</b></a></p>
    </div>
</main>
<footer class="foot">
  <p style="color: #CBC3D7;">© 2024 Social Circle. All rights reserved.</p>
</footer>
