<ion-header>
  <ion-toolbar>
    <div class="search-toolbar">
      <button class="icon-button" aria-label="Camera">
        <span class="material-symbols-outlined">camera_alt</span>
      </button>
      <h1 class="search-title">Social Circle</h1>

      <button class="icon-button header-favourite" aria-label="Favourites">
        <span class="heart-circle">
          <span class="material-symbols-outlined">favorite</span>
        </span>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="search-main">

    <section class="search-section">

      <div class="search-container">
        <span class="material-symbols-outlined">search</span>
        <input type="text" placeholder="Search for messages..." />
      </div>

    </section>

    <section class="trending-section">

      <button
        class="trending-button"
        [class.active]="selectedTrend === 'Trending'"
        (click)="selectTrend('Trending')">
        #Trending
      </button>

      <button
        class="trending-button"
        [class.active]="selectedTrend === 'Fashion'"
        (click)="selectTrend('Fashion')">
        #Fashion
      </button>

      <button
        class="trending-button"
        [class.active]="selectedTrend === 'Gaming'"
        (click)="selectTrend('Gaming')">
        #Gaming
      </button>

      <button
        class="trending-button"
        [class.active]="selectedTrend === 'VibeCheck'"
        (click)="selectTrend('VibeCheck')">
        #VibeCheck
      </button>

      <button
        class="trending-button"
        [class.active]="selectedTrend === 'TechLife'"
        (click)="selectTrend('TechLife')">
        #TechLife
      </button>

      <button
        class="trending-button"
