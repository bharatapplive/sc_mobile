<ion-header>
  <ion-toolbar>
    <div class="message-toolbar">
      <div>
        <p class="eyebrow">Stay connected</p>
        <h1>Messages</h1>
      </div>
      <span class="material-symbols-outlined toolbar-icon" aria-hidden="true"
        >forum</span
      >
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="pt-20 pb-24 px-margin-mobile max-w-2xl mx-auto">
    <!-- Search Bar -->
    <section class="mb-8">
      <div class="relative group">
        <div
          class="absolute inset-y-0 left-4 flex items-center pointer-events-none"
        >
          <span class="material-symbols-outlined text-outline text-[20px]"
            >search</span
          >
        </div>
        <input
          class="w-full h-12 pl-12 pr-4 bg-surface-container-low border-none rounded-full font-body-md text-on-surface focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline/60"
          placeholder="Search conversations..."
          type="text"
        />
      </div>
    </section>

    <!-- Horizontal Stories Row -->
    <section class="mb-10 overflow-hidden">
      <div class="flex gap-4 overflow-x-auto pb-4 px-2 -mx-2 snap-x">
        <!-- User Own Story -->
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="relative w-16 h-16">
            <img
              class="w-full h-full rounded-full object-cover p-[2px] bg-surface border-2 border-dashed border-outline-variant"
              data-alt="A professional studio portrait of a young creative person with a friendly expression, soft cinematic lighting, pastel purple background, highly detailed skin texture, artistic and modern digital aesthetic for Social Circle app."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsMKuP9hnTpvsCLN0vy4nlVcvGncWz1DIco_MPGtiHWBpPgZWUj6Xc-MFqy4q0XxQQmM62ZRZs5Ed6w97N7Xsh8Ty4m1g-wS2iC7oPyhjJzw_AF4Qsn3N38UfJcOU9ayygHgOH7nx4uGnk4kPv6EB-vjtLB2YTe873Ub7_3l-pyci-NsttnD1DfK40oAV2mvh4-O7YW2bNs-5PiMG4zbAI21Ce8xiVZT-R5zCyJknF-uoXkOH-FOjlcEkR8PU6v-6iKuG6Gj3BWdY"
            />
            <div
              class="absolute bottom-0 right-0 w-5 h-5 bg-primary rounded-full flex items-center justify-center border-2 border-surface"
            >
              <span
                class="material-symbols-outlined text-white text-[14px]"
                style="font-variation-settings: &quot;wght&quot; 700"
                >add</span
              >
            </div>
          </div>
          <span class="font-label-sm text-on-surface-variant">Your Note</span>
        </div>

        <!-- Friends Stories -->
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="w-16 h-16 rounded-full story-ring">
            <img
              class="w-full h-full rounded-full object-cover border-2 border-surface"
              data-alt="A vibrant close-up portrait of a woman with neon-toned lighting reflecting off her glasses, futuristic urban background, electric purple and magenta color palette, crisp focus, Social Circle brand style."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB30wUaCekFFOOyq99O5RzkINj7s0Ppdt5CNyn2OyMQ4uxPuZNrCN7pb-fRunQ0EgNTmzqEZGckU9lqEtC1EZizfcLzlU_ynqpgazHLmfE2v3NWZXCSlS4AJW4IzpdVX7U5i3QlSH_BJ5pxk5hpYa_mg0Jeym8KqVAPs6vCZZx3IiShodN7-mAe9-3Adak2h3G2rnI9VspsnTkNS3Ae3-42COKJPGdbe5QyWh0minL5gjBNtQid_6aFTTxww9iLxZrWWBkGlpYh3A"
            />
          </div>
          <span class="font-label-sm text-on-surface-variant">Alex</span>
        </div>
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="w-16 h-16 rounded-full story-ring">
            <img
              class="w-full h-full rounded-full object-cover border-2 border-surface"
              data-alt="A candid lifestyle shot of a young man drinking coffee in a sun-drenched minimalist loft, high-key lighting, soft lilac shadows, professional photography, high-end creator aesthetic."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuASSe0q_I3nQGm6IG5_4SYHVaXoJqyUZ-7DkmxJ-atU80MaQLBZF_apLuevRKtdaJ1QavISRfj9tCOP7YCuK6DZ1L19l4zSrb59cfsr6hb5KFDLd8amK9jl_DJ6c-ZjJbaax_obJPCRpfavN5J8pg1Ok9ODnMQ-ob0tRJoct42wScOZaPzAuF3QTu6GFZOX4CzmKK2OwNKyQO4pn4SwdLUuJOTyCuJOVlUqWqMD7tXLMuUehD1waeRM8DLxXPnP4JDqSW_kTKXzJGQ"
            />
          </div>
          <span class="font-label-sm text-on-surface-variant">Jordan</span>
        </div>
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="w-16 h-16 rounded-full p-[2px] bg-surface-variant/30">
            <img
              class="w-full h-full rounded-full object-cover border-2 border-surface"
              data-alt="Stylized artistic portrait of a person with colorful hair, soft focus background of a digital art studio, warm natural lighting, modern social media profile style, vibrant purple accents."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKIlAZIm4USU6hQhUsn_s1Nakjlpy63x8TVZzbQ8P9Nt1KcEtl3wyF7ObYnmPiKO_1wyaUvI_bsjtGbdbCz8_ZYwDPpKTIqSauobn_h9Nz3nKRwTLyKqkYyH1nQ8kgXljOEC06AzWrAtJMdNjip-HmdXCDQBvlkA6m6f4O1-CfO1mevBi9OU2kFM0Y5aOX0k3aCdKKrokDfbLA0tv4zW9HzjkddgpT9BwpPUqEUJ2a4Z795p2WhDj2Vhgi7Byh7dUxQjfm8mwtS-A"
            />
          </div>
          <span class="font-label-sm text-on-surface-variant">Mika</span>
        </div>
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="w-16 h-16 rounded-full story-ring">
            <img
              class="w-full h-full rounded-full object-cover border-2 border-surface"
              data-alt="Elegant close up of a young woman laughing, soft afternoon sunlight, bokeh background of a botanical garden, sophisticated minimalist clothing, bright and airy photographic style."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuAA6Vnt3XNIokonC-HSjaOsi9v8nLZBEJj6qydnYuEoJ5G7_pgPWdsj5a6GYPiPt5JMVYhWZ4cOSd6Wosi6uGKseUoT4um5mVthekxhK1D7nclzhS1Ss9_fXP-UOzVC628Xu7zGLOGjo_2k_aQAMIw30t5xpSdh26aQNOJVf__z3erL073qMlJ92Xup8VWTa7OJHg3jiVN15NW8ua4AsnNVSszk9tX_UuVNhhqBjZ3HGXyl-HNwmytGHvCS_qO9jirwI8iJKGzcoYg"
            />
          </div>
          <span class="font-label-sm text-on-surface-variant">Sarah</span>
        </div>
        <div class="flex flex-col items-center gap-2 snap-start shrink-0">
          <div class="w-16 h-16 rounded-full story-ring">
            <img
              class="w-full h-full rounded-full object-cover border-2 border-surface"
              data-alt="Dynamic portrait of a male gamer in a room filled with purple LED lights, cool technology aesthetic, sharp focus, vibrant electric colors, modern digital native identity."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDEnKdoSYT-6bkn6c-qwL3Qq0qILtKrVanUdhUXFhPkHzzZTJwKhxLcHOdckjcb3Rr72e7OKObdzDxjbzV7ZTxxK9yHDgSbeKtg6JiPCeGJSmFqgCZr63vGgsS4DNOsruCncX3LldJU7q8IVQxtW7QW7ptlOY8zITAl9ZujjuUAx5Ph54aT_3zVTW4vy7V6xQWCN18uHdyVDkmA7C7wfWY5cWvB4RXap0G0xp-qX4E6-9YSrIiZApamaKRgVXqEuR1WDy2R3rT0q0"
            />
          </div>
          <span class="font-label-sm text-on-surface-variant">Leo</span>
        </div>
      </div>
    </section>

    <!-- Message List -->
    <section id="user-list" class="space-y-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-headline-md text-on-surface">Messages</h2>
        <button
          class="text-primary font-label-lg hover:opacity-80 transition-opacity"
        >
          Requests (2)
        </button>
      </div>
      <div
        *ngFor="let user of users; let index = index"
        class="group flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/10 hover:border-primary/20 transition-all cursor-pointer active:scale-[0.98]"
        (click)="navigateToMessageDetail(user)"
      >
      <!-- step 1 establish a method to go to the message detail page and pass the selected user data to it. This can be done using Angular's router and state management. In the navigateToMessageDetail method, we can use the router to navigate to the message detail page and pass the selected user as state. -->
        <div class="relative shrink-0">
          <img
            class="user-profile-avatar w-14 h-14 rounded-full object-cover"
            [src]="user.profileImage || user.image || user.avatar || 'assets/default-avatar.svg'"
            [alt]="(user.name || user.username || user.mobile || 'User') + ' profile photo'"
          />
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center mb-0.5">
            <div class="flex flex-col items-start min-w-0">
              <span class="font-label-lg text-on-surface">
                {{ user.firstName + ' ' + user.lastName }}
              </span>
              <span class="font-label-sm text-on-surface-variant">
                {{ user.userName}}
              </span>
            </div>
            <div *ngFor="let msg of messages">
              <span>{{msg.message}}</span>
            </div>
            <!-- <span class="font-label-sm text-outline"></span>
              hello{{ user.lastMessageAt || '' }}</span> -->
          </div>
        </div>
      </div>
    </section>
  </main>
</ion-content>
