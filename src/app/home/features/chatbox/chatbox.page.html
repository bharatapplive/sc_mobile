<ion-toolbar slot="top">
  <div class="panels">
    <ion-button fill="clear">
      <ion-label>Social Circle</ion-label>
    </ion-button>
    <div>
      <ion-button fill="clear" slot="end">
        <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-toolbar>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
      <ion-refresher-content 
        pullingIcon="chevron-down-circle-outline" 
        pullingText="Pull down to refresh" 
        refreshingSpinner="circles" 
        refreshingText="Fetching profile...">
      </ion-refresher-content>
    </ion-refresher>
    
    <section class="search-Bar-container">
      <ion-item lines="none" class="place-holder">
          <ion-icon slot="start" name="search-outline"></ion-icon>
          <ion-input type="text" name="searchbar" placeholder="Search trends, creators, or tags.." required minlength="5"></ion-input>
      </ion-item>
    </section>

    <section class="story-panel">
      <div class="story-context">
        <ion-avatar class="person">
          <ion-img [src]="user?.avatarUrl" alt="User Avatar"></ion-img>  
        </ion-avatar>
        <span>Your note</span>
      </div>
      
      <div class="story-context" *ngFor="let item of followingList" (click)="openPrivateChat(item)">
        <div class="online-relative">
          <ion-avatar class="person" >
            <ion-img [src]="item.avatarUrl" alt="User Avatar"></ion-img>
          </ion-avatar>
          <ion-icon class="story-add-absolute" name="online"></ion-icon>
        </div>
        <span>{{item?.fullname}}</span>
      </div>
    </section>

    <section class="switch-msg">
      <div class="filter toggle">
        <ion-button shape="round" size="small" fill="clear">
          <ion-icon slot="icon-only" name="options-outline"></ion-icon>
          <ion-icon slot="icon-only" name="chevron-down-outline"></ion-icon>
        </ion-button>

        <ion-button shape="round" size="small" fill="clear" *ngFor="let tag of tags" [class.active]="selectedTag === tag"
          (click)="selectTag(tag)"><span>{{tag}}</span></ion-button>
      </div>

      <div class="list-msg">
        <div class="card-board" *ngFor="let person of messages" (click)="openGroupChat(person)">
          <div class="online-relative">
            <ion-avatar class="msg-person">
            </ion-avatar>
            <ion-icon class="story-add-absolute" name="ellipse" color="success"></ion-icon>
          </div>
          <div class="card-title-msg" [class.seen]="isMessageRead(person)" [class.unseen]="!isMessageRead(person)">
            <div class="person-name-time">
              <span>{{person.senderUserName}}</span>
              <h6>{{(person.createdAt) | timeAgo}}</h6>
            </div>
            <p>{{person.message}}</p>
          </div>
        </div>
      </div>
    </section>
    
    <section class="follow-list card-board">
      <div class="header-bar">
        <span>Accounts to follow</span>
        <ion-button shape="round" size="small" fill="clear">See all</ion-button>
      </div>

      <div class="person-list" *ngFor="let item of follows">
        <div class="avatar">
          <ion-avatar>           
            <ion-img [src]="item.avatarUrl" alt="User Avatar"></ion-img>
          </ion-avatar>
          <div class="title">
            <h2>{{item?.username}}</h2>
            <span>{{item?.fullname}}</span>
          </div>
        </div>
        <div class="tabs">
          @if(isFollower(item)){
            <ion-button shape="round" size="small" fill="clear" (click)="onClickFollow(item)">Follow Back</ion-button>
          }@else{
            <ion-button shape="round" size="small" fill="clear" (click)="onClickFollow(item)">Follow</ion-button>
          }
        </div>
      </div>
    </section>
  </div>
</ion-content>
