<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <div class="user-details">
      <ion-avatar class="msg-person" >
        <ion-img [src]="activeUserProfilePic" alt="User Avatar"></ion-img>
      </ion-avatar>
      <div class="title" (click)="openUserInfo()">
        <ion-title class="U-name">{{ activeUserFName || 'Private Chat' }}</ion-title>
        <span>{{activeUserUName}}</span>
      </div>
    </div>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="none">
    <div
      *ngFor="let msg of messages"
      [class.my-message]="isMyMessage(msg.senderId)"
      [class.other-message]="!isMyMessage(msg.senderId)"
      class="message-wrapper"
    >
      <!-- Optional Sender Avatar for incoming messages -->
      <div class="sender-pic">
        <ion-avatar class="msg-person" *ngIf="!isMyMessage(msg.senderId)">
          <ion-img [src]="activeUserProfilePic" alt="User Avatar"></ion-img>
        </ion-avatar>
      </div>

      <div class="message-bubble">
        <!-- Sender Name (Shown only for received messages) -->
        <div class="sender-name" *ngIf="!isMyMessage(msg.senderId)">
          {{ getSenderName(msg.senderId) }}
        </div>

        <!-- Render Media (Image) if messageType is image -->
        <div *ngIf="msg.messageType === 'image' && msg.mediaUrl" class="media-container">
          <img [src]="msg.mediaUrl" alt="Shared Image" class="chat-media-image" />
        </div>

        <!-- Text Message Content -->
        <p class="message-text" *ngIf="msg.text">{{ msg.text }}</p>

        <!-- Time Badge -->
        <span class="message-time">
          {{ msg.createdAt | timeAgo }}
        </span>
      </div>
    </div>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar class="input-holder">
    <ion-input
      [(ngModel)]="newMessageText"
      placeholder="Type a message..."
      (keyup.enter)="onSend()"
    ></ion-input>
    @if(!newMessageText){
      <ion-buttons slot="end" class="otherButtons">
        <ion-button>
          <ion-icon name="mic-outline"></ion-icon>
        </ion-button>
        <ion-button>
          <ion-icon name="image-outline"></ion-icon>
        </ion-button>
        <ion-button>
          <ion-icon name="sad-outline"></ion-icon>
        </ion-button>
        <ion-button>
          <ion-icon name="add-circle-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    }@else{
      <ion-buttons slot="end">
        <!-- Step1. Sending the massage -->
        <ion-button (click)="onSend()">
          <ion-icon name="send"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-footer>
