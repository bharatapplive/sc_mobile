<ion-content [fullscreen]="true">

  <div class="reels-container">

    <!-- Reel 1 -->
    <div class="reel">
      <video
        class="reel-video"
        src="assets/videos/reel1.mp4"
        autoplay
        loop
        muted
        playsinline>
      </video>

      <div class="reel-actions">
        <button>♡</button>
        <button>💬</button>
        <button>↗</button>
        <button>🔖</button>
      </div>

      <div class="reel-info">
        <h3>@socialcircle</h3>
        <p>Welcome to Social Circle ✨</p>
      </div>
    </div>

    <!-- Reel 2 -->
