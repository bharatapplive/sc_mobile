<ion-header>
  <ion-toolbar class="chat-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home/message"></ion-back-button>
    </ion-buttons>
    <div class="contact-summary">
      <!-- <div class="contact-avatar" aria-hidden="true">MC</div> -->
      <div class="contact-copy">
        <ion-title>{{ session.user?.userName || 'Maya Chen' }}</ion-title>
        <span class="contact-status"
          ><span class="status-dot"></span>Active now</span
        >
      </div>
    </div>
    <ion-buttons slot="end" class="header-actions">
      <ion-button aria-label="Start a voice call">
        <ion-icon name="call-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button aria-label="More conversation options">
        <ion-icon name="ellipsis-vertical" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

    <form class="composer" #messageForm="ngForm" (ngSubmit)="sendMessageHandler()">
      <div class="composer-input-wrap">
        <input
          type="text"
          aria-label="Message"
          placeholder="Write a message…"
          name="message"
          [(ngModel)]="messageText"
          required
        />
      </div>
      <button
        type="submit"
        class="send-button"
        aria-label="Send message"
        [disabled]="messageForm.invalid"
      >
        <ion-icon name="send" aria-hidden="true"></ion-icon>
