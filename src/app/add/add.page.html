<ion-header class="add-header">
  <ion-toolbar>

    <div class="top-navigation">

      <!-- CLOSE -->
      <button class="close-button" (click)="closePage()">
        <span class="material-symbols-outlined">
          close
        </span>
      </button>

      <!-- TITLE -->
      <h1>NEW POST</h1>

      <!-- NEXT -->
      <button class="next-button" (click)="nextStep()">
        Next
      </button>

    </div>

  </ion-toolbar>
</ion-header>


<ion-content
  [fullscreen]="true"
  class="add-content">

  <div class="add-container">

    <!-- =========================
         IMAGE PREVIEW
    ========================== -->

    <div class="preview-area">

      <img
        class="preview-image"
        [src]="selectedImage"
        alt="Selected post image"
      />

      <!-- PREVIEW CONTROL -->

      <div class="preview-controls">

        <button
          class="preview-button"
          (click)="togglePreview()">

          <span class="material-symbols-outlined">
            aspect_ratio
          </span>

        </button>

      </div>

    </div>


    <!-- =========================
         MODE SELECTOR
    ========================== -->

    <div class="mode-bar">

      <div class="mode-tabs">

        <button
          [class.active]="selectedMode === 'POST'"
          (click)="selectMode('POST')">
          POST
        </button>

        <button
          [class.active]="selectedMode === 'STORY'"
          (click)="selectMode('STORY')">
          STORY
        </button>

        <button
          [class.active]="selectedMode === 'REEL'"
          (click)="selectMode('REEL')">
          REEL
        </button>

        <button
          [class.active]="selectedMode === 'LIVE'"
          (click)="selectMode('LIVE')">
          LIVE
        </button>

      </div>


      <!-- CONTROL BUTTONS -->

      <div class="media-controls">

        <!-- CAMERA -->

        <button
          class="small-control"
          (click)="openCamera()">

          <span class="material-symbols-outlined">
            photo_camera
          </span>

        </button>


        <!-- GALLERY -->

        <button
          class="gallery-button"
          (click)="openGallery()">

          <span class="material-symbols-outlined">
            content_copy
          </span>

        </button>

      </div>

    </div>


    <!-- Hidden file input -->

    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      (change)="onImageSelected($event)"
    />


    <!-- =========================
         GALLERY
    ========================== -->

    <div class="gallery-grid">

      <!-- IMAGE 1 -->

      <div
