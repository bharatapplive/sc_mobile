<ion-header>
  <ion-toolbar>
    <div class="feed-toolbar">
      <div class="feed-brand">
        <button class="icon-button" aria-label="Camera">
          <span class="material-symbols-outlined">camera_alt</span>
        </button>
        <h1 class="feed-title">Social Circle</h1>
      </div>
      <button class="icon-button" aria-label="Messages">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

    <div class="feed-list" *ngIf="!isLoading && !errorMessage">
      <article class="feed-post glass-card" *ngFor="let post of feed">
        <div class="post-header">
          <div class="post-user">
            <div class="avatar-wrap story-gradient">
              <div class="avatar-inner">
                <img [src]="post.avatar" [alt]="post.userName" />
              </div>
            </div>
            <div>
              <p class="username">{{ post.userName }}</p>
              <p class="location">{{ post.location }}</p>
            </div>
          </div>
          <button class="icon-button icon-button--small" aria-label="More options">
            <span class="material-symbols-outlined">more_horiz</span>
          </button>
        </div>

        <div class="post-image-wrap" *ngIf="getPrimaryMedia(post) as media">
          <img class="post-image" [src]="media.url" [alt]="media.altText" />
        </div>

        <div class="post-content">
          <div class="post-actions">
            <div class="action-group">
              <button class="icon-button icon-button--action" aria-label="Like">
                <span class="material-symbols-outlined" [class.icon-filled]="post.isLikedByMe">favorite</span>
              </button>
              <button class="icon-button icon-button--action" aria-label="Comment">
                <span class="material-symbols-outlined">chat_bubble</span>
              </button>
              <button class="icon-button icon-button--action" aria-label="Share">
                <span class="material-symbols-outlined">send</span>
              </button>
            </div>
            <button class="icon-button icon-button--action" aria-label="Save">
              <span class="material-symbols-outlined" [class.icon-filled]="post.isBookmarkedByMe">bookmark</span>
            </button>
          </div>
          <div class="post-meta">
            <p class="likes">{{ post.likesCount | number }} likes</p>
            <p class="caption"><span class="caption-user">{{ post.userName }}</span> {{ post.caption }}</p>
            <button class="comment-link" type="button">View all {{ post.commentsCount }} comments</button>
            <p class="time-stamp">{{ formatTimeAgo(post.createdAt) }}</p>
          </div>
        </div>
      </article>
    </div>

    <div *ngIf="isLoading" class="feed-list">
      <p>Loading feed...</p>
    </div>

    <div *ngIf="errorMessage" class="feed-list">
      <p>{{ errorMessage }}</p>
    </div>
