<ion-content [fullscreen]="true" class="page">
  <main class="box">
    <!-- <div class="toggle" role="group" aria-label="Theme switcher">
      <button type="button" [class.active]="theme === 'light'" (click)="setTheme('light')">Light</button>
      <button type="button" [class.active]="theme === 'dark'" (click)="setTheme('dark')">Dark</button>
    </div> -->

    <header class="head">
      <img src="./assets/logo.png" class="app-logo" alt="App Logo">
      <h1>Social Circle</h1>
      <p>Connect with creators, share your story, and join the digital circle.</p>
    </header>

    <div class="card">
      <form class="form" action="#" method="POST">
        <div class="field">
          <label for="identity">Mobile Number or Email</label>
          <div class="input">
            <ion-icon name="call-outline"></ion-icon>
            <input id="identity" name="identity" placeholder="+1 (555) 000-0000 or email@address.com" required type="text" />
          </div>
        </div>

        <div class="field">
          <div class="row flex justify-content-between">
            <label for="password">Password</label>
            <a href="#">Forgot Password?</a>
          </div>
          <div class="input">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input id="password" name="password" placeholder="••••••••" required type="password" />
            <button type="button" aria-label="Show password">
              <ion-icon name="eye-outline"></ion-icon>
            </button>
          </div>
        </div>
<button class="btn vibrant-gradient" type="submit">Log In</button>
     
      <div class="divider">OR CONTINUE WITH</div>
      

      <div class="social-buttons-container">
        <button class="social-btn" type="button">
          <!-- In Ionic/Angular, save your icons in the src/assets folder -->
          
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width: 20px; margin-right: 8px;">
          Google
        </button>
        
        <button class="social-btn" type="button">
          
          <ion-icon name="logo-apple" style="color: #000000; font-size: 20px; margin-right: 8px;"></ion-icon>
          Apple
        </button>
      </div>
      
      
      </form>



    
    </div>

    <footer class="foot">
      <p>
        Don't have an account?
        <a href="#">Sign Up</a>
      </p>
      <div class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Help</a>
      </div>
      
    </footer>
  </main>
</ion-content>
