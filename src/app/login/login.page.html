<ion-content class="custom-bg">
  <div class="main-container">
    
    <!-- Header Section -->
    <div class="header-section">
      <div class="logo-box">
        <ion-icon name="people"></ion-icon>
      </div>
      <h1 class="title">Social Circle</h1>
      <p class="subtitle">Connect with creators, share your story, and join the digital circle.</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <div class="input-group">
        <ion-label class="input-label">Username or Email</ion-label>
        <div class="input-box">
          <ion-icon name="at-outline" class="icon-left"></ion-icon>
          <ion-input type="email" placeholder="username@social.com"></ion-input>
        </div>
      </div>

      <div class="input-group">
        <ion-label class="input-label">Password</ion-label>
        <div class="input-box">
          <ion-icon name="lock-closed-outline" class="icon-left"></ion-icon>
          <!-- Yahan change kiya hai: [type]="passwordType" -->
          <ion-input [type]="passwordType" placeholder="Password"></ion-input>
          <!-- Yahan change kiya hai: Click function aur dynamic icon -->
          <ion-icon [name]="passwordIcon" class="icon-right" style="cursor: pointer;" (click)="togglePasswordMode()"></ion-icon>
        </div>
      </div>

      <div class="forgot-password">
        <a style="cursor: pointer;" (click)="forgotPassword()">Forgot Password?</a>
      </div>

      <ion-button expand="block" class="login-btn" (click)="login()">Log In</ion-button>
    </div>

    <!-- Divider Section -->
    <div class="divider">
      <span>OR CONTINUE WITH</span>
    </div>

    <!-- Social Login Section -->
    <div class="social-login-section">
      <button class="social-btn" (click)="loginWithGoogle()">
        <ion-icon name="logo-google" class="google-icon"></ion-icon>
        Google
      </button>
      <button class="social-btn" (click)="loginWithApple()">
        <ion-icon name="logo-apple" class="apple-icon"></ion-icon>
        Apple
      </button>
    </div>

    <!-- Footer Section -->
    <div class="footer-section">
      <p>Don't have an account? <a (click)="goToRegistration()" style="cursor: pointer; color: #4c6baf; font-weight: bold; text-decoration: none;">Sign Up</a></p>
    </div>

  </div>
</ion-content>
