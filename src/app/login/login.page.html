<ion-content [fullscreen]="true" class="page">
  <main class="box">
    <!-- <div class="toggle" role="group" aria-label="Theme switcher">
      <button type="button" [class.active]="theme === 'light'" (click)="setTheme('light')">Light</button>
      <button type="button" [class.active]="theme === 'dark'" (click)="setTheme('dark')">Dark</button>
    </div> -->

    <header class="head">
      <div class="icon vibrant-gradient">
        <span class="material-symbols-outlined">group</span>
      </div>
      <h1>Social Circle</h1>
      <p>Connect with creators, share your story, and join the digital circle.</p>
    </header>

    <section class="card">
      <form class="form" (submit)="login($event)">

        <div class="field">
          <label for="identity">Mobile Number or Email</label>

          <div class="input">
            <span class="material-symbols-outlined">phone</span>

            <input
              id="identity"
              name="identity"
              type="text"
              placeholder="+91 0000000000 or email@address.com"
              required
            />
          </div>
        </div>

        <div class="field">
          <div class="row flex justify-content-between">
            <label for="password">Password</label>
            <a href="#">Forgot Password?</a>
          </div>

          <div class="input">
            <span class="material-symbols-outlined">lock</span>

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword">
              <span class="material-symbols-outlined">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button class="btn vibrant-gradient" type="submit">
          Log In
        </button>

      </form>
      
      <div class="divider">
        <span></span>
        <p>OR CONTINUE WITH</p>
        <span></span>
      </div>

      <div class="socials">

        <button class="social" type="button">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.26.81-.58z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
          </svg>
          <span>Google</span>
        </button>

        <button class="social" type="button">
          <svg class="apple-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.05 20.28c-.96.95-2.18 1.78-3.41 1.78-1.33 0-1.84-.79-3.41-.79-1.57 0-2.12.78-3.41.78-1.18 0-2.54-.95-3.51-1.92-2.14-2.14-2.73-5.78-1.07-8.15 1.06-1.52 2.76-2.5 4.54-2.5 1.3 0 2.22.75 3.33.75 1.09 0 2.16-.77 3.44-.77 1.54 0 2.82.78 3.65 1.86-3.1 1.65-2.61 5.92.51 7.16-.48 1.48-1.5 3.23-2.67 4.3zm-4.32-15.69c0-1.78 1.46-3.23 3.23-3.23.04 0 .09 0 .14.01 0 1.78-1.46 3.23-3.23 3.23-.05 0-.1 0-.14-.01z"></path>
          </svg>
          <span>Apple</span>
        </button>

      </div>  
    
    </section>

    <footer class="foot">
      <p>
        Don't have an account?
        <a routerLink="/account">Sign Up</a>
      </p>
      <div class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Help</a>
      </div>
    </footer>
  </main>
</ion-content>
