<ion-content [fullscreen]="true" class="page">
  <main class="box">
    <!-- <div class="toggle" role="group" aria-label="Theme switcher">
      <button type="button" [class.active]="theme === 'light'" (click)="setTheme('light')">Light</button>
      <button type="button" [class.active]="theme === 'dark'" (click)="setTheme('dark')">Dark</button>
    </div> -->

    <header class="head">
      <div class="icon vibrant-gradient">
        <span class="material-symbols-outlined">group</span>
      </div>
      <h1>Social Circle</h1>
      <p>Connect with creators, share your story, and join the digital circle.</p>
    </header>

    <div class="card">
      <form class="form" action="#" method="POST">
        <div class="field">
          <label for="identity">Mobile Number or Email</label>
          <div class="input">
            <span class="material-symbols-outlined">phone</span>
            <input id="identity" name="identity" placeholder="+1 (555) 000-0000 or email@address.com" required type="text" />
          </div>
        </div>

        <div class="field">
          <div class="row flex justify-content-between">
            <label for="password">Password</label>
            <a href="#">Forgot Password?</a>
          </div>
          <div class="input">
            <span class="material-symbols-outlined">lock</span>
            <input id="password" name="password" placeholder="••••••••" required type="password" />
            <button type="button" aria-label="Show password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <button class="btn vibrant-gradient" type="submit">Log In</button>
      </form>



    
    </div>

    <footer class="foot">
      <p>
        Don't have an account?
        <a routerLink="/registration">Sign Up</a>
      </p>
      <div class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Help</a>
      </div>
    </footer>
  </main>
</ion-content>
