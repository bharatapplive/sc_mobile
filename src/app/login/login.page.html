<ion-content [fullscreen]="true" class="page">
  <main class="box">
    <header class="head">
      <div class="icon vibrant-gradient" id="rotate">
        <ion-icon class="user" name="people-outline"></ion-icon>
      </div>
      <h1>Social Circle</h1>
      <p>Connect with creators, share your story, and join the digital circle.</p>
    </header>

    <div class="card">
      <form class="form" action="#" method="POST">
        <div class="field">
          <label for="identity">Mobile Number or Email</label>
          <div class="input">
            <span class="material-symbols-outlined">phone</span>
            <input id="identity" name="identity" placeholder="social@gmail.com" required type="text" />
          </div>
        </div>

        <div class="field">
          <div class="row flex justify-content-between">
            <label for="password">Password</label>
            <a href="#">Forgot Password?</a>
          </div>
          <div class="input">
            <span class="material-symbols-outlined">lock</span>
            <input id="password" name="password" placeholder="••••••••" required type="password" />
            <div type="button" aria-label="Show password">
              <span class="material-symbols-outlined">visibility</span>
            </div>
          </div>
        </div>

        <button class="btn vibrant-gradient" type="submit">Log In</button>
        <div class="line">
          <div class="Divido">------------ OR CONTINUE WITH ------------</div>
        </div>
        <div class="option">
          <div class="google">
            <!-- <ion-icon class="user" name=""></ion-icon> -->
            Google
          </div>
          <div class="google">Apple</div>
        </div>
      </form>




    </div>

    <footer class="foot">
      <div class="account">
        <p class="acc">
          Don't have an account?
          <a href="#">Sign Up</a>
        </p>
      </div>

      <div class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Help</a>
      </div>
    </footer>
  </main>
</ion-content>
