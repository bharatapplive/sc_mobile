<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="ion-padding-top" color="white" style="--padding-top: 12px;">
    <ion-title color="black" style="font-weight: 800; font-size: 20px;">Social Circle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" refreshingSpinner="crescent">
    </ion-refresher-content>
  </ion-refresher>

  <div class="container">
    <section class="search-Bar-container">
      <ion-item lines="none" class="place-holder">
        <ion-icon slot="start" name="search-outline"></ion-icon>
        <ion-input type="text" name="searchbar" placeholder="Search trends, creators, or tags.."
          (ionInput)="onSearchChange($event)"></ion-input>
      </ion-item>
    </section>

    <section class="tab-bar">
      <div class="tags-scroll-container">
        <ion-button shape="round" size="small" fill="clear" *ngFor="let tag of tags" class="chips"
          [class.active]="selectedTag === tag" (click)="selectTag(tag)">
          <span>{{ tag }}</span>
        </ion-button>
      </div>
    </section>

    <section class="file-container card-board">
      <ion-grid class="masonry-grid">
        <div class="masonry-item" *ngFor="let item of allItems">
          <ion-img class="card-img" [src]="item.url"></ion-img>
          <ion-icon [name]="item.isLiked ? 'heart' : 'heart-outline'" class="favorite-icon" [class.liked]="item.isLiked"
            (click)="toggleFavorite(item)"></ion-icon>
          <div class="card-overlay bottom">
            <div class="user-info">
              <ion-avatar class="avatar">
                <ion-img [src]="item.url"></ion-img>
              </ion-avatar>
              <span class="username">{{item?.title}}</span>
            </div>
          </div>
        </div>
      </ion-grid>
    </section>

    <ion-infinite-scroll threshold="150px" (ionInfinite)="loadMore($event)">
      <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Loading more...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
