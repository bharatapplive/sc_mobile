<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <div class="feed-top-bar">
      <button class="top-btn" aria-label="Add story or post">
        <ion-icon name="add-outline"></ion-icon>
      </button>

      <h1 class="top-username">Social Circle</h1>

      <button class="top-btn" aria-label="Open menu">
        <ion-icon name="menu-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull to Refresh -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" refreshingSpinner="crescent">
    </ion-refresher-content>
  </ion-refresher>

  <main class="feed-container">
    <!-- Stories Carousel -->
    <section class="stories-section">
      <div class="stories-row">
        <div *ngFor="let story of stories" class="story-item">
          <!-- Story Avatar with Purple Ring -->
          <div class="story-ring" [class.user-ring]="story.isUser">
            <img [src]="story.avatar || defaultAvatar" [alt]="story.username" class="story-avatar-img" />

            <!-- User + Badge -->
            <div *ngIf="story.isUser" class="story-add-badge">
              <ion-icon name="add"></ion-icon>
            </div>
          </div>

          <span class="story-label">{{ story.username }}</span>
        </div>
      </div>
    </section>

    <!-- Feed Posts List -->
    <section class="feed-posts-list">
      <article *ngFor="let post of posts" class="feed-card">
        <!-- Post Header -->
        <div class="card-header">
          <div class="user-block">
            <div class="avatar-ring">
              <img [src]="post.author.avatar || defaultAvatar" [alt]="post.author.username" class="avatar-img" />
            </div>

            <div class="user-info">
              <h2 class="username">{{ post.author.username }}</h2>
              <span *ngIf="post.author.location" class="location">{{ post.author.location }}</span>
            </div>
          </div>

          <button class="options-btn" aria-label="More options">
            <ion-icon name="ellipsis-horizontal"></ion-icon>
          </button>
        </div>

        <!-- Post Image -->
        <div class="card-media" (dblclick)="onDoubleTap(post)">
          <img [src]="post.image" [alt]="post.caption" class="media-img" />

          <div *ngIf="post.animatingHeart" class="heart-pulse-wrap">
            <ion-icon name="heart" class="heart-pulse-icon"></ion-icon>
          </div>
        </div>

        <!-- Post Footer Details -->
        <div class="card-footer">
          <!-- Action Icons Row -->
          <div class="actions-row">
            <div class="left-actions">
              <button class="action-icon-btn" [class.is-liked]="post.isLiked" (click)="toggleLike(post)"
                aria-label="Like post">
                <ion-icon [name]="post.isLiked ? 'heart' : 'heart-outline'"></ion-icon>
              </button>

              <button class="action-icon-btn" (click)="toggleComments(post)" aria-label="Comment on post">
                <ion-icon name="chatbubble-outline"></ion-icon>
              </button>

              <button class="action-icon-btn" aria-label="Share post">
                <ion-icon name="paper-plane-outline"></ion-icon>
              </button>
            </div>

            <button class="action-icon-btn" [class.is-saved]="post.isSaved" (click)="toggleSave(post)"
              aria-label="Save post">
              <ion-icon [name]="post.isSaved ? 'bookmark' : 'bookmark-outline'"></ion-icon>
            </button>
          </div>

          <!-- Likes and Caption Meta -->
          <div class="meta-section">
            <p class="likes-count">{{ post.likesCount | number }} likes</p>

            <p class="caption-line">
              <span class="caption-username">{{ post.author.username }}</span>
              <span class="caption-text">{{ post.caption }}</span>
            </p>

            <button *ngIf="post.commentsCount > 0" class="view-comments-btn" (click)="toggleComments(post)">
              View all {{ post.commentsCount }} comments
            </button>

            <span class="time-ago-label">{{ post.timeAgo }}</span>
          </div>
        </div>
      </article>
    </section>
  </main>
</ion-content>
