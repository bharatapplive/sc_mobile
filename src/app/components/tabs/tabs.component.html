<ion-tabs>
  <ion-tab-bar slot="bottom">
    @for(tab of tabs; track tab.id){
    <ion-tab-button [tab]="tab.id" [routerLink]="tab.route" [class.is-active]="activeTab() === tab.id"
      (click)="selectTab(tab.id)" #rla="routerLinkActive" [routerLinkActive]="['is-active']" [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon aria-hidden="true" [name]="activeTab() === tab.id ? tab.icon : tab.icon"></ion-icon>
      <ion-label>{{ tab.label }}</ion-label>
    </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
